<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Админка — Исследования</title>
<style>
@font-face{font-family:"TT Norms Pro Tochka";src:url("/onboarding-prototype/fonts/TT_Norms_Pro_Tochka_Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"TT Norms Pro Tochka";src:url("/onboarding-prototype/fonts/TT_Norms_Pro_Tochka_Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"TT Norms Pro Tochka";src:url("/onboarding-prototype/fonts/TT_Norms_Pro_Tochka_DemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"TT Norms Pro Tochka";src:url("/onboarding-prototype/fonts/TT_Norms_Pro_Tochka_Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--c-primary:#191919;--c-secondary:#676767;--c-placeholder:#949494;--c-brand:#835de1;--c-brand-hover:#7249d1;--c-white:#fff;--c-bg:#f9f9f9;--c-field:rgba(25,25,25,0.05);--c-field-hover:rgba(25,25,25,0.08);--c-border:rgba(25,25,25,0.08);--c-divider:rgba(25,25,25,0.1);--r-s:8px;--r-m:12px;--r-l:16px;--r-xl:20px;--shadow-drop:0 20px 40px rgba(0,0,0,0.1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"TT Norms Pro Tochka",-apple-system,BlinkMacSystemFont,sans-serif;font-size:16px;line-height:1.25;color:var(--c-primary);background:var(--c-bg);-webkit-font-smoothing:antialiased;min-height:100vh}
.layout{display:flex;width:100%;min-height:100vh}
.sidebar{width:260px;min-width:260px;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;flex-shrink:0;overflow-y:auto;background:var(--c-white);border-right:1px solid var(--c-border)}
.sidebar-logo{padding:20px 20px 12px 24px;font-size:20px;font-weight:700;color:var(--c-primary);display:flex;align-items:center;gap:8px}
.sidebar-logo .dot{width:8px;height:8px;border-radius:50%;background:var(--c-brand)}
.sidebar-section-label{font-size:11px;font-weight:600;letter-spacing:0.4px;text-transform:uppercase;color:var(--c-placeholder);padding:16px 12px 6px 24px}
.sidebar-menu{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-s);font-size:14px;font-weight:500;color:var(--c-secondary);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .15s,color .15s}
.sidebar-item:hover{background:var(--c-field);color:var(--c-primary)}
.sidebar-item.active{background:rgba(131,93,225,.08);color:var(--c-brand)}
.sidebar-item svg{width:20px;height:20px;flex-shrink:0}
.sidebar-spacer{flex:1}
.sidebar-bottom{padding:16px 12px 20px}
.sidebar-back{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--c-secondary);text-decoration:none;padding:9px 12px;border-radius:var(--r-s);transition:background .15s,color .15s}
.sidebar-back:hover{background:var(--c-field);color:var(--c-brand)}
.sidebar-divider{height:1px;background:var(--c-divider);margin:4px 24px}
.main{flex:1;min-width:0;overflow-y:auto;height:100vh;padding:32px 40px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:16px}
.page-header-left{display:flex;flex-direction:column;gap:4px}
.page-title{font-size:28px;font-weight:600;color:var(--c-primary)}
.page-subtitle{font-size:14px;color:var(--c-secondary)}
.page-actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border:none;border-radius:var(--r-m);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--c-brand);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--c-brand-hover)}
.btn-secondary{background:var(--c-field);color:var(--c-primary)}
.btn-secondary:hover:not(:disabled){background:var(--c-field-hover)}
.btn-danger{background:#e74c3c;color:#fff}
.btn-danger:hover:not(:disabled){background:#c0392b}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:var(--r-s)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--c-white);border:1px solid var(--c-border);border-radius:var(--r-l);padding:20px 24px;display:flex;flex-direction:column;gap:4px}
.stat-label{font-size:13px;color:var(--c-secondary);font-weight:500}
.stat-value{font-size:28px;font-weight:700;color:var(--c-primary)}
.stat-value.brand{color:var(--c-brand)}
.stat-value.green{color:#27ae60}
.stat-value.orange{color:#e67e22}
.card{background:var(--c-white);border:1px solid var(--c-border);border-radius:var(--r-l);padding:24px;margin-bottom:20px}
.card-title{font-size:16px;font-weight:600;margin-bottom:16px}
.data-table{width:100%}
.data-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-s);transition:background .1s}
.data-row:not(.header):hover{background:var(--c-field)}
.data-row.header{font-size:12px;font-weight:600;color:var(--c-placeholder);text-transform:uppercase;letter-spacing:.3px;padding:6px 12px;border-bottom:1px solid var(--c-divider)}
.data-cell{display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge.grade{background:rgba(131,93,225,0.1);color:var(--c-brand)}
.badge.active-badge{background:rgba(39,174,96,0.1);color:#27ae60}
.actions-cell{display:flex;gap:4px}
.btn-icon{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:none;background:none;border-radius:var(--r-s);cursor:pointer;color:var(--c-secondary);transition:background .15s,color .15s}
.btn-icon:hover{background:var(--c-field);color:var(--c-primary)}
.btn-icon.danger:hover{background:rgba(231,76,60,.1);color:#e74c3c}
.btn-icon svg{width:16px;height:16px}
.order-arrows{display:flex;flex-direction:column;gap:1px}
.order-arrow{background:none;border:none;cursor:pointer;font-size:10px;color:var(--c-placeholder);padding:0 2px;line-height:1;transition:color .15s}
.order-arrow:hover:not(:disabled){color:var(--c-brand)}
.order-arrow:disabled{opacity:.25;cursor:default}
.toggle{position:relative;display:inline-flex;width:38px;height:22px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:#ccc;border-radius:22px;transition:background .2s}
.toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle input:checked+.toggle-slider{background:var(--c-brand)}
.toggle input:checked+.toggle-slider::before{transform:translateX(16px)}
.desc-preview{font-size:13px;color:var(--c-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;display:block}
.click-count{font-weight:600;font-variant-numeric:tabular-nums}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--c-white);border-radius:var(--r-xl);width:100%;max-width:520px;box-shadow:var(--shadow-drop);overflow:hidden}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--c-divider)}
.modal-title{font-size:18px;font-weight:600}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--c-secondary);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-s);transition:background .15s}
.modal-close:hover{background:var(--c-field)}
.form-group{padding:12px 24px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--c-secondary);margin-bottom:6px}
.form-input,.form-textarea,.form-select{width:100%;padding:10px 14px;border:1.5px solid var(--c-border);border-radius:var(--r-m);font-family:inherit;font-size:14px;color:var(--c-primary);background:var(--c-white);outline:none;transition:border-color .15s}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--c-brand)}
.form-textarea{min-height:80px;resize:vertical}
.form-row-inline{display:flex;align-items:center;gap:10px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--c-divider)}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px 24px 24px}
.summary-item{display:flex;flex-direction:column;gap:2px}
.summary-label{font-size:12px;font-weight:600;color:var(--c-placeholder);text-transform:uppercase;letter-spacing:.3px}
.summary-value{font-size:15px;font-weight:500}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.confirm-box{background:var(--c-white);border-radius:var(--r-xl);padding:32px;max-width:380px;width:100%;text-align:center;box-shadow:var(--shadow-drop)}
.confirm-icon{font-size:36px;margin-bottom:12px}
.confirm-title{font-size:20px;font-weight:600;margin-bottom:8px}
.confirm-text{font-size:14px;color:var(--c-secondary);margin-bottom:20px;line-height:1.5}
.confirm-actions{display:flex;gap:8px;justify-content:center}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:80px 20px;color:var(--c-secondary);font-size:15px}
.loading-spinner{width:28px;height:28px;border:3px solid var(--c-border);border-top-color:var(--c-brand);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 20px;color:var(--c-secondary);font-size:15px}
.empty-icon{font-size:40px;opacity:.6}
/* study selector in sidebar */
.study-selector{padding:12px 12px 4px;position:relative}
.study-select-btn{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-m);border:1.5px solid var(--c-border);background:var(--c-white);font-family:inherit;font-size:13px;font-weight:500;color:var(--c-primary);cursor:pointer;transition:border-color .15s;text-align:left}
.study-select-btn:hover{border-color:var(--c-brand)}
.study-select-btn .study-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.study-select-btn .study-arrow{flex-shrink:0;color:var(--c-placeholder);transition:transform .2s}
.study-select-btn.open .study-arrow{transform:rotate(180deg)}
.study-active-dot{width:6px;height:6px;border-radius:50%;background:#27ae60;flex-shrink:0}
.study-dropdown{position:absolute;left:12px;right:12px;top:100%;margin-top:4px;background:var(--c-white);border:1px solid var(--c-border);border-radius:var(--r-m);box-shadow:var(--shadow-drop);z-index:50;max-height:260px;overflow-y:auto;display:none}
.study-dropdown.show{display:block}
.study-dd-item{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;font-weight:500;cursor:pointer;transition:background .1s;color:var(--c-primary)}
.study-dd-item:hover{background:var(--c-field)}
.study-dd-item.selected{background:rgba(131,93,225,.06);color:var(--c-brand)}
.study-dd-item .dd-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.study-dd-divider{height:1px;background:var(--c-divider);margin:4px 0}
.study-dd-add{color:var(--c-brand);font-weight:600}
/* study cards on Studies tab */
.studies-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.study-card{background:var(--c-white);border:1.5px solid var(--c-border);border-radius:var(--r-l);padding:20px;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative}
.study-card:hover{border-color:var(--c-brand);box-shadow:0 4px 16px rgba(131,93,225,.1)}
.study-card.is-active{border-color:#27ae60}
.study-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.study-card-name{font-size:16px;font-weight:600;flex:1}
.study-card-desc{font-size:13px;color:var(--c-secondary);margin-bottom:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.study-card-meta{display:flex;gap:12px;font-size:12px;color:var(--c-placeholder);font-weight:500}
.study-card-meta span{display:flex;align-items:center;gap:4px}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><span class="dot"></span> Админка</div>
    <div class="study-selector" id="study-selector-wrap"></div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section-label">Навигация</div>
    <nav class="sidebar-menu">
      <button class="sidebar-item" id="nav-studies" onclick="switchTab('studies')">
        <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M6 7h8M6 10h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Исследования
      </button>
      <button class="sidebar-item active" id="nav-tasks" onclick="switchTab('tasks')">
        <svg viewBox="0 0 20 20" fill="none"><path d="M4 5h12M4 10h12M4 15h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Задания
      </button>
      <button class="sidebar-item" id="nav-participants" onclick="switchTab('participants')">
        <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M4 17c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Участники
      </button>
    </nav>
    <div class="sidebar-divider" style="margin-top:8px"></div>
    <nav class="sidebar-menu" style="padding-top:4px">
      <button class="sidebar-item" onclick="exportCSV()">
        <svg viewBox="0 0 20 20" fill="none"><path d="M6 13l4 4 4-4M10 17V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 10V5a2 2 0 012-2h10a2 2 0 012 2v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Экспорт CSV
      </button>
      <button class="sidebar-item" onclick="refreshData()">
        <svg viewBox="0 0 20 20" fill="none"><path d="M17 10a7 7 0 01-13.16 3.36M3 10a7 7 0 0113.16-3.36" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M3 14v-4h4M17 6v4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Обновить
      </button>
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-bottom">
      <a class="sidebar-back" href="/onboarding-prototype/">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 15l-5-5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        К прототипу
      </a>
    </div>
  </aside>
  <main class="main" id="app">
    <div class="loading-state"><div class="loading-spinner"></div><div>Загрузка…</div></div>
  </main>
</div>
<script>
const FB='https://datagatetest-4f190-default-rtdb.firebaseio.com';
let studies=[],participants=[],tasks=[],currentTab='tasks',currentStudyKey=null;

async function fbFetch(p){try{const r=await fetch(FB+'/'+p+'.json');const d=await r.json();if(!d)return[];return Object.entries(d).map(([k,v])=>({...v,_key:k}))}catch(e){console.warn(e);return[]}}
async function fbPush(p,d){try{const r=await fetch(FB+'/'+p+'.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();return j?.name}catch(e){return null}}
async function fbUpdate(p,d){try{await fetch(FB+'/'+p+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})}catch(e){}}
async function fbDelete(p){try{const r=await fetch(FB+'/'+p+'.json',{method:'DELETE'});return r.ok}catch(e){return false}}

async function fetchStudies(){
  studies=await fbFetch('onboarding_studies');
  studies.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  if(!currentStudyKey && studies.length){
    const active=studies.find(s=>s.active);
    currentStudyKey=active?active._key:studies[0]._key;
  }
}
async function fetchStudyData(){
  if(!currentStudyKey){tasks=[];participants=[];return}
  const[t,p]=await Promise.all([
    fbFetch('onboarding_tasks/'+currentStudyKey),
    fbFetch('onboarding_participants/'+currentStudyKey)
  ]);
  tasks=t.sort((a,b)=>(a.order||0)-(b.order||0));
  participants=p;
  console.log('[dashboard v2] studyKey=',currentStudyKey,'tasks=',tasks.length,'participants=',participants.length,participants);
}
/* version marker — if you see this in page source, cache is fresh */
const _DASHBOARD_VERSION='2026-09-02-v2';
async function fetchAll(){await fetchStudies();await fetchStudyData()}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function escA(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.sidebar-item').forEach(e=>e.classList.remove('active'));
  const n=document.getElementById('nav-'+t);if(n)n.classList.add('active');
  render();
}
function render(){
  renderStudySelector();
  const a=document.getElementById('app');
  if(currentTab==='studies')renderStudies(a);
  else if(currentTab==='tasks')renderTasks(a);
  else renderParticipants(a);
}

/* === STUDY SELECTOR IN SIDEBAR === */
function renderStudySelector(){
  const wrap=document.getElementById('study-selector-wrap');if(!wrap)return;
  if(!studies.length){
    wrap.innerHTML='<button class="study-select-btn" onclick="openStudyModal(-1)" style="justify-content:center;color:var(--c-brand);font-weight:600">+ Создать исследование</button>';
    return;
  }
  const cur=studies.find(s=>s._key===currentStudyKey);
  const isActive=cur&&cur.active;
  wrap.innerHTML='<button class="study-select-btn" id="study-toggle" onclick="toggleStudyDropdown()">'+(isActive?'<span class="study-active-dot"></span>':'')+'<span class="study-name">'+esc(cur?cur.name:'\u2014')+'</span><span class="study-arrow">\u25BE</span></button><div class="study-dropdown" id="study-dd"></div>';
  buildStudyDropdown();
}
function toggleStudyDropdown(){
  const dd=document.getElementById('study-dd');
  const btn=document.getElementById('study-toggle');
  if(!dd||!btn)return;
  const open=dd.classList.toggle('show');
  btn.classList.toggle('open',open);
  if(open){
    const close=e=>{if(!dd.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){dd.classList.remove('show');btn.classList.remove('open');document.removeEventListener('click',close)}};
    setTimeout(()=>document.addEventListener('click',close),0);
  }
}
function buildStudyDropdown(){
  const dd=document.getElementById('study-dd');if(!dd)return;
  let h='';
  studies.forEach(s=>{
    const sel=s._key===currentStudyKey?' selected':'';
    const dot=s.active?'<span class="study-active-dot"></span>':'';
    h+='<div class="study-dd-item'+sel+'" onclick="selectStudy(\''+s._key+'\')">'+dot+'<span class="dd-name">'+esc(s.name)+'</span></div>';
  });
  h+='<div class="study-dd-divider"></div><div class="study-dd-item study-dd-add" onclick="openStudyModal(-1)">+ Новое исследование</div>';
  dd.innerHTML=h;
}
async function selectStudy(key){
  if(key===currentStudyKey)return;
  currentStudyKey=key;
  document.getElementById('study-dd')?.classList.remove('show');
  document.getElementById('study-toggle')?.classList.remove('open');
  document.getElementById('app').innerHTML='<div class="loading-state"><div class="loading-spinner"></div><div>\u0417\u0430\u0433\u0440\u0443\u0437\u043a\u0430\u2026</div></div>';
  await fetchStudyData();render();
}

/* === STUDIES TAB === */
function renderStudies(app){
  const total=studies.length;
  const activeS=studies.find(s=>s.active);
  let cards='';
  if(!total){
    cards='<div class="empty-state"><div class="empty-icon">\ud83d\udcda</div><div>\u0418\u0441\u0441\u043b\u0435\u0434\u043e\u0432\u0430\u043d\u0438\u0439 \u043f\u043e\u043a\u0430 \u043d\u0435\u0442. \u0421\u043e\u0437\u0434\u0430\u0439\u0442\u0435 \u043f\u0435\u0440\u0432\u043e\u0435.</div></div>';
  } else {
    cards='<div class="studies-grid">';
    studies.forEach((s,i)=>{
      const date=s.createdAt?new Date(s.createdAt).toLocaleDateString('ru-RU'):'\u2014';

  o.onclick=e=>{if(e.target===o)o.remove()};
  const titleText=isNew?'Новое исследование':'Редактировать';
  const btnText=isNew?'Создать':'Сохранить';
  o.innerHTML='<div class="modal"><div class="modal-header"><div class="modal-title">'+titleText+'</div><button class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">&#10005;</button></div><div class="form-group"><label class="form-label">Название *</label><input class="form-input" id="study-name" placeholder="Напр.: Онбординг таблиц" value="'+escA(s.name)+'"></div><div class="form-group"><label class="form-label">Описание</label><textarea class="form-textarea" id="study-desc" placeholder="Цель, контекст, сроки…">'+esc(s.description||'')+'</textarea></div><div class="form-actions"><button class="btn btn-secondary" onclick="this.closest(\'.modal-overlay\').remove()">Отмена</button><button class="btn btn-primary" id="study-save" onclick="saveStudy('+idx+')">'+btnText+'</button></div></div>';
  document.body.appendChild(o);
  setTimeout(()=>document.getElementById('study-name')?.focus(),100);

async function saveStudy(idx){
  const name=document.getElementById('study-name').value.trim();
  const desc=document.getElementById('study-desc').value.trim();
  if(!name){document.getElementById('study-name').style.borderColor='#e74c3c';return}
  const btn=document.getElementById('study-save');btn.textContent='Сохранение\u2026';btn.disabled=true;
  const now=new Date().toISOString();
  if(idx===-1){
    const isFirst=studies.length===0;
    const d={name,description:desc,active:isFirst,createdAt:now,updatedAt:now};
    const k=await fbPush('onboarding_studies',d);
    if(k){studies.unshift({...d,_key:k});if(isFirst)currentStudyKey=k;}
  } else {
    const s=studies[idx];
    await fbUpdate('onboarding_studies/'+s._key,{name,description:desc,updatedAt:now});
    s.name=name;s.description=desc;s.updatedAt=now;
  }
  document.querySelector('.modal-overlay')?.remove();render();
}
async function setActiveStudy(key){
  for(const s of studies){
    if(s.active&&s._key!==key){s.active=false;await fbUpdate('onboarding_studies/'+s._key,{active:false})}
  }
  const target=studies.find(s=>s._key===key);
  if(target){target.active=true;await fbUpdate('onboarding_studies/'+key,{active:true})}
  render();
}
function selectStudyAndSwitch(key){
  currentStudyKey=key;
  switchTab('tasks');
  fetchStudyData().then(()=>render());
}
function confirmDeleteStudy(i){
  const s=studies[i];if(!s)return;
  showConfirm('исследование \u00ab'+esc(s.name)+'\u00bb со всеми заданиями и участниками',async()=>{
    await Promise.all([fbDelete('onboarding_studies/'+s._key),fbDelete('onboarding_tasks/'+s._key),fbDelete('onboarding_participants/'+s._key)]);
    studies.splice(i,1);
    if(currentStudyKey===s._key){currentStudyKey=studies.length?studies[0]._key:null;await fetchStudyData()}
    render();
  });
}

async function saveTask(idx){
  const title=document.getElementById('task-title').value.trim();
  const desc=document.getElementById('task-desc').value.trim();
  const active=document.getElementById('task-active').checked;
  if(!title){document.getElementById('task-title').style.borderColor='#e74c3c';return}

  const now=new Date().toISOString();

async function moveTask(i,dir){
  const ni=i+dir;if(ni<0||ni>=tasks.length)return;

}
async function toggleActive(i,v){

}
function confirmDeleteTask(i){
  const t=tasks[i];if(!t)return;
  showConfirm('задание \u00ab'+esc(t.title)+'\u00bb',async()=>{
    if(await fbDelete('onboarding_tasks/'+currentStudyKey+'/'+t._key)){
      tasks.splice(i,1);
      await Promise.all(tasks.map((t,j)=>{t.order=j;return t._key?fbUpdate('onboarding_tasks/'+currentStudyKey+'/'+t._key,{order:j}):null}).filter(Boolean));
      render();
    } else alert('Ошибка удаления');
  });
}

/* === PARTICIPANTS TAB === */
function getTaskStats(p){
  let prog=p.taskProgress||[];
  // Firebase RTDB может хранить массив как объект {0:{...},1:{...},...}
  if(prog&&!Array.isArray(prog)&&typeof prog==='object'){prog=Object.values(prog)}
  if(!Array.isArray(prog))prog=[];
  const completed=prog.filter(t=>t.status==='completed').length;
  const skipped=prog.filter(t=>t.status==='skipped').length;
  const total=tasks.filter(t=>t.active!==false).length;
  const done=p.allTasksCompleted===true;
  const totalMs=prog.reduce((s,t)=>s+(t.durationMs||0),0);
  return {completed,skipped,total,done,totalMs,progress:prog};
}

  if(!currentStudyKey){app.innerHTML='<div class="empty-state"><div class="empty-icon">\ud83d\udcda</div><div>Сначала создайте исследование</div></div>';return}

  const n=participants.length;
  const activeTasks=tasks.filter(t=>t.active!==false).length;
  const doneCount=participants.filter(p=>p.allTasksCompleted===true).length;
  const inProgress=participants.filter(p=>!p.allTasksCompleted&&p.taskProgress&&(Array.isArray(p.taskProgress)?p.taskProgress.length>0:typeof p.taskProgress==='object'&&Object.keys(p.taskProgress).length>0)).length;
  const notStarted=n-doneCount-inProgress;
  let rows='';

    participants.forEach((p,i)=>{

      const st=getTaskStats(p);
      const statusBadge=st.done
        ?'<span class="badge" style="background:#e8f5e9;color:#2e7d32">Завершил</span>'
        :(st.completed+st.skipped>0
          ?'<span class="badge" style="background:#fff3e0;color:#e65100">В процессе</span>'
          :'<span class="badge" style="background:var(--c-field);color:var(--c-placeholder)">Не начал</span>');
      const progText='\u2705 '+st.completed+(st.skipped>0?' \u00b7 \u23ed '+st.skipped:'')+' / '+st.total;

    });

  app.innerHTML='<div class="page-header"><div class="page-header-left"><h1 class="page-title">\ud83d\udc65 Участники</h1><div class="page-subtitle">'+esc(curStudy?curStudy.name:'')+' \u00b7 '+n+' участников</div></div><div class="page-actions"><button class="btn btn-secondary" onclick="exportCSV()">Экспорт CSV</button></div></div><div class="stats-grid"><div class="stat-card"><div class="stat-label">Участников</div><div class="stat-value brand">'+n+'</div></div><div class="stat-card"><div class="stat-label">Завершили все</div><div class="stat-value green">'+doneCount+'</div></div><div class="stat-card"><div class="stat-label">В процессе</div><div class="stat-value orange">'+inProgress+'</div></div><div class="stat-card"><div class="stat-label">Не начали</div><div class="stat-value">'+notStarted+'</div></div></div><div class="card"><div class="card-title">Список участников</div>'+rows+'</div>';

function deleteParticipant(i){
  const p=participants[i];if(!p||!p._key)return;

function exportCSV(){
  if(!participants.length)return alert('Нет данных');
  const curStudy=studies.find(s=>s._key===currentStudyKey);
  const activeTasks=tasks.filter(t=>t.active!==false);
  const taskHeaders=activeTasks.map((t,i)=>'Задание '+(i+1)+': '+t.title);
  const h=['\u2116','Грейд','Должность','Дата','Статус','Выполнено','Пропущено','Общее время (сек)',...taskHeaders];
  const rows=participants.map((p,i)=>{
    const st=getTaskStats(p);
    const status=st.done?'Завершил':(st.completed+st.skipped>0?'В процессе':'Не начал');
    const totalSec=Math.round(st.totalMs/1000);
    const taskCols=activeTasks.map(t=>{
      const entry=st.progress.find(tp=>tp.taskKey===t._key);
      if(!entry) return '"—"';
      return '"'+(entry.status==='completed'?'Выполнено':'Пропущено')+' ('+Math.round((entry.durationMs||0)/1000)+'с)"';
    });
    return [i+1,'"'+(p.grade||'').replace(/"/g,'""')+'"','"'+(p.position||'').replace(/"/g,'""')+'"','"'+(p.registeredAt||'')+'"','"'+status+'"',st.completed,st.skipped,totalSec,...taskCols].join(',');
  });
  const csv='\uFEFF'+h.join(',')+"\n"+rows.join("\n");
  const b=new Blob([csv],{type:'text/csv;charset=utf-8;'});const u=URL.createObjectURL(b);
  const sname=(curStudy?curStudy.name:'export').replace(/[^a-zA-Z0-9\u0400-\u04FF_-]/g,'_');
  const a=document.createElement('a');a.href=u;a.download=sname+'_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();URL.revokeObjectURL(u);
}

function showConfirm(name,onOk){
  const o=document.createElement('div');o.className='confirm-overlay';
  o.onclick=e=>{if(e.target===o)o.remove()};
  o.innerHTML='<div class="confirm-box"><div class="confirm-icon">&#9888;&#65039;</div><div class="confirm-title">Удалить?</div><div class="confirm-text">Вы собираетесь удалить <strong>'+name+'</strong>.<br>Это нельзя отменить.</div><div class="confirm-actions"><button class="btn btn-secondary" id="c-cancel">Отмена</button><button class="btn btn-danger" id="c-delete">Удалить</button></div></div>';
  document.body.appendChild(o);
  o.querySelector('#c-cancel').onclick=()=>o.remove();
  o.querySelector('#c-delete').onclick=async()=>{o.querySelector('#c-delete').textContent='Удаление\u2026';o.querySelector('#c-delete').disabled=true;await onOk();o.remove()};
}

async function refreshData(){
  document.getElementById('app').innerHTML='<div class="loading-state"><div class="loading-spinner"></div><div>Загрузка\u2026</div></div>';
  await fetchAll();render();
}

(async()=>{await fetchAll();render()})();

</script>
