<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — Задания и участники</title>
<style>
@font-face{font-family:"TT Norms Pro Tochka";src:url("/onboarding-prototype/fonts/TT_Norms_Pro_Tochka_Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"TT Norms Pro Tochka";src:url("/onboarding-prototype/fonts/TT_Norms_Pro_Tochka_Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"TT Norms Pro Tochka";src:url("/onboarding-prototype/fonts/TT_Norms_Pro_Tochka_DemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"TT Norms Pro Tochka";src:url("/onboarding-prototype/fonts/TT_Norms_Pro_Tochka_Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--c-primary:#191919;--c-secondary:#676767;--c-placeholder:#949494;--c-brand:#835de1;--c-brand-hover:#7249d1;--c-white:#fff;--c-bg:#f9f9f9;--c-field:rgba(25,25,25,0.05);--c-field-hover:rgba(25,25,25,0.08);--c-border:rgba(25,25,25,0.08);--c-divider:rgba(25,25,25,0.1);--r-s:8px;--r-m:12px;--r-l:16px;--r-xl:20px;--shadow-drop:0 20px 40px rgba(0,0,0,0.1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"TT Norms Pro Tochka",-apple-system,BlinkMacSystemFont,sans-serif;font-size:16px;line-height:1.25;color:var(--c-primary);background:var(--c-bg);-webkit-font-smoothing:antialiased;min-height:100vh}
.layout{display:flex;width:100%;min-height:100vh}
.sidebar{width:260px;min-width:260px;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;flex-shrink:0;overflow-y:auto;background:var(--c-white);border-right:1px solid var(--c-border)}
.sidebar-logo{padding:20px 20px 12px 24px;font-size:20px;font-weight:700;color:var(--c-primary);display:flex;align-items:center;gap:8px}
.sidebar-logo .dot{width:8px;height:8px;border-radius:50%;background:var(--c-brand)}
.sidebar-section-label{font-size:11px;font-weight:600;letter-spacing:0.4px;text-transform:uppercase;color:var(--c-placeholder);padding:16px 12px 6px 24px}
.sidebar-menu{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-s);font-size:14px;font-weight:500;color:var(--c-secondary);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .15s,color .15s}
.sidebar-item:hover{background:var(--c-field);color:var(--c-primary)}
.sidebar-item.active{background:rgba(131,93,225,.08);color:var(--c-brand)}
.sidebar-item svg{width:20px;height:20px;flex-shrink:0}
.sidebar-spacer{flex:1}
.sidebar-bottom{padding:16px 12px 20px}
.sidebar-back{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--c-secondary);text-decoration:none;padding:9px 12px;border-radius:var(--r-s);transition:background .15s,color .15s}
.sidebar-back:hover{background:var(--c-field);color:var(--c-brand)}
.sidebar-divider{height:1px;background:var(--c-divider);margin:4px 24px}
.main{flex:1;min-width:0;overflow-y:auto;height:100vh;padding:32px 40px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:16px}
.page-header-left{display:flex;flex-direction:column;gap:4px}
.page-title{font-size:28px;font-weight:600;color:var(--c-primary)}
.page-subtitle{font-size:14px;color:var(--c-secondary)}
.page-actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border:none;border-radius:var(--r-m);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--c-brand);color:var(--c-white)}.btn-primary:hover:not(:disabled){background:var(--c-brand-hover)}
.btn-secondary{background:var(--c-field);color:var(--c-primary)}.btn-secondary:hover:not(:disabled){background:var(--c-field-hover)}
.btn-danger{background:rgba(249,142,136,.1);color:#e74c3c}.btn-danger:hover:not(:disabled){background:rgba(249,142,136,.2)}
.btn-icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;border-radius:var(--r-s);color:var(--c-secondary);transition:background .15s,color .15s}
.btn-icon:hover{background:var(--c-field)}.btn-icon svg{width:16px;height:16px}
.btn-icon.danger{color:#e74c3c}.btn-icon.danger:hover{background:rgba(231,76,60,.08)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:2px;border-radius:var(--r-l);overflow:hidden;margin-bottom:24px}
.stat-card{background:var(--c-white);padding:20px;display:flex;flex-direction:column;gap:6px}
.stat-label{font-size:13px;font-weight:500;color:var(--c-secondary)}
.stat-value{font-size:30px;font-weight:600;color:var(--c-primary)}
.stat-value.brand{color:var(--c-brand)}.stat-value.green{color:#3F9180}.stat-value.orange{color:#E5952D}
.card{background:var(--c-white);border-radius:var(--r-l);padding:24px;margin-bottom:16px}
.card-title{font-size:18px;font-weight:500;color:var(--c-primary);margin-bottom:16px}
.data-table{display:flex;flex-direction:column;gap:2px;border-radius:var(--r-m);overflow:hidden}
.data-row{display:flex;gap:2px;min-height:52px}
.data-row.header{font-size:13px;font-weight:500;color:var(--c-secondary)}
.data-row.header .data-cell{background:rgba(25,25,25,.07);padding:10px 16px;display:flex;align-items:center}
.data-cell{background:var(--c-field);padding:12px 16px;display:flex;align-items:center;font-size:14px;color:var(--c-primary);min-width:0}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--r-s);font-size:12px;font-weight:500}
.badge.grade{background:rgba(131,93,225,.1);color:var(--c-brand)}
.toggle{position:relative;width:40px;height:22px;display:inline-block;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#ccc;border-radius:11px;cursor:pointer;transition:background .2s}
.toggle-slider::before{content:"";position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle input:checked+.toggle-slider{background:var(--c-brand)}
.toggle input:checked+.toggle-slider::before{transform:translateX(18px)}
.order-arrows{display:flex;flex-direction:column;gap:2px}
.order-arrow{width:22px;height:16px;display:flex;align-items:center;justify-content:center;border:none;background:var(--c-field);border-radius:4px;cursor:pointer;color:var(--c-secondary);font-size:9px;transition:background .15s,color .15s;padding:0}
.order-arrow:hover:not(:disabled){background:var(--c-brand);color:#fff}
.order-arrow:disabled{opacity:.25;cursor:default}
.desc-preview{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--c-secondary);font-size:13px}
.actions-cell{display:flex;gap:4px;justify-content:flex-end}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.form-label{font-size:13px;font-weight:600;color:var(--c-secondary)}
.form-input,.form-textarea{padding:12px 14px;border:1px solid var(--c-border);border-radius:var(--r-s);font-family:inherit;font-size:15px;color:var(--c-primary);background:var(--c-white);outline:none;transition:border-color .15s;width:100%}
.form-input:focus,.form-textarea:focus{border-color:var(--c-brand)}
.form-textarea{min-height:100px;resize:vertical}
.form-input::placeholder,.form-textarea::placeholder{color:var(--c-placeholder)}
.form-actions{display:flex;gap:10px;justify-content:flex-end;padding-top:8px}
.form-row-inline{display:flex;align-items:center;gap:12px}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:120px 20px;gap:16px;color:var(--c-placeholder)}
.loading-spinner{width:40px;height:40px;border:3px solid var(--c-border);border-top-color:var(--c-brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:60px 20px;color:var(--c-placeholder);background:var(--c-field);border-radius:var(--r-m)}
.empty-icon{font-size:40px;margin-bottom:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadeIn .15s ease}
.modal{background:var(--c-white);border-radius:var(--r-xl);max-width:560px;width:100%;max-height:85vh;overflow-y:auto;padding:32px;box-shadow:var(--shadow-drop);animation:scaleIn .2s ease}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.modal-title{font-size:22px;font-weight:600;color:var(--c-primary)}
.modal-close{width:32px;height:32px;border-radius:var(--r-s);border:none;background:var(--c-field);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.modal-close:hover{background:var(--c-divider)}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;animation:fadeIn .15s ease}
.confirm-box{background:var(--c-white);border-radius:var(--r-xl);padding:32px;max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow-drop);animation:scaleIn .15s ease}
.confirm-icon{font-size:40px;margin-bottom:16px}
.confirm-title{font-size:18px;font-weight:600;margin-bottom:8px}
.confirm-text{font-size:14px;color:var(--c-secondary);margin-bottom:24px;line-height:20px}
.confirm-actions{display:flex;gap:12px;justify-content:center}
.confirm-actions .btn{min-width:120px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;border-radius:var(--r-m);overflow:hidden}
.summary-item{background:var(--c-field);padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.summary-label{font-size:12px;font-weight:500;color:var(--c-secondary);text-transform:uppercase;letter-spacing:.3px}
.summary-value{font-size:16px;font-weight:500;color:var(--c-primary)}
.click-count{font-weight:600;color:var(--c-brand)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:900px){.sidebar{display:none}.main{padding:20px}.summary-grid{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">DataGate <span class="dot"></span> Admin</div>
    <div class="sidebar-section-label">Управление</div>
    <div class="sidebar-menu">
      <button class="sidebar-item active" onclick="switchTab('tasks')" id="nav-tasks">
        <svg viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M7 10l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Задания
      </button>
      <button class="sidebar-item" onclick="switchTab('participants')" id="nav-participants">
        <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3.5" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 17.5c0-3.59 2.91-6.5 6.5-6.5s6.5 2.91 6.5 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Участники
      </button>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section-label">Данные</div>
    <div class="sidebar-menu">
      <button class="sidebar-item" onclick="exportCSV()">
        <svg viewBox="0 0 20 20" fill="none"><path d="M10 3v10m0 0l-3-3m3 3l3-3M4 15h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Экспорт CSV
      </button>
      <button class="sidebar-item" onclick="refreshData()">
        <svg viewBox="0 0 20 20" fill="none"><path d="M3 10a7 7 0 0112.9-3.8M17 10a7 7 0 01-12.9 3.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M15 3v4h-4M5 17v-4h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Обновить
      </button>
    </div>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-bottom">
      <a href="/onboarding-prototype/" class="sidebar-back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Вернуться к прототипу
      </a>
    </div>
  </aside>
  <div class="main" id="app">
    <div class="loading-state"><div class="loading-spinner"></div><div>Загрузка данных…</div></div>
  </div>
</div>
<script>
const FB='https://datagatetest-4f190-default-rtdb.firebaseio.com';
let participants=[],tasks=[],currentTab='tasks';

async function fbFetch(p){try{const r=await fetch(FB+'/'+p+'.json');const d=await r.json();if(!d)return[];return Object.entries(d).map(([k,v])=>({...v,_key:k}))}catch(e){console.warn(e);return[]}}
async function fbPush(p,d){try{const r=await fetch(FB+'/'+p+'.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();return j?.name}catch(e){return null}}
async function fbUpdate(p,d){try{await fetch(FB+'/'+p+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})}catch(e){}}
async function fbDelete(p){try{const r=await fetch(FB+'/'+p+'.json',{method:'DELETE'});return r.ok}catch(e){return false}}

async function fetchAll(){
  const[p,t]=await Promise.all([fbFetch('onboarding_participants'),fbFetch('onboarding_tasks')]);
  participants=p;tasks=t.sort((a,b)=>(a.order||0)-(b.order||0));
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function escA(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.sidebar-item').forEach(e=>e.classList.remove('active'));
  const n=document.getElementById('nav-'+t);if(n)n.classList.add('active');
  render();
}
function render(){const a=document.getElementById('app');if(currentTab==='tasks')renderTasks(a);else renderParticipants(a)}
/* === TASKS TAB === */
function renderTasks(app){
  const ac=tasks.filter(t=>t.active!==false).length;
  let rows='';
  if(tasks.length===0){
    rows='<div class="empty-state"><div class="empty-icon">\u{1F4CB}</div><div>Заданий пока нет. Создайте первое.</div></div>';
  } else {
    rows='<div class="data-table"><div class="data-row header"><div class="data-cell" style="width:50px"></div><div class="data-cell" style="width:50px">№</div><div class="data-cell" style="flex:2">Название</div><div class="data-cell" style="flex:3">Описание</div><div class="data-cell" style="width:80px">Активно</div><div class="data-cell" style="width:90px"></div></div>';
    tasks.forEach((t,i)=>{
      rows+='<div class="data-row"><div class="data-cell" style="width:50px;justify-content:center"><div class="order-arrows"><button class="order-arrow" onclick="moveTask('+i+',-1)"'+(i===0?' disabled':'')+'>&#9650;</button><button class="order-arrow" onclick="moveTask('+i+',1)"'+(i===tasks.length-1?' disabled':'')+'>&#9660;</button></div></div><div class="data-cell" style="width:50px"><span class="badge grade">'+(i+1)+'</span></div><div class="data-cell" style="flex:2"><strong>'+esc(t.title||'Без названия')+'</strong></div><div class="data-cell" style="flex:3"><span class="desc-preview">'+esc(t.description||'\u2014')+'</span></div><div class="data-cell" style="width:80px"><label class="toggle"><input type="checkbox"'+(t.active!==false?' checked':'')+' onchange="toggleActive('+i+',this.checked)"><span class="toggle-slider"></span></label></div><div class="data-cell" style="width:90px"><div class="actions-cell"><button class="btn-icon" onclick="openTaskModal('+i+')" title="Ред."><svg viewBox="0 0 16 16" fill="none"><path d="M11.5 2.5l2 2L5 13H3v-2l8.5-8.5z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="btn-icon danger" onclick="confirmDeleteTask('+i+')" title="Уд."><svg viewBox="0 0 16 16" fill="none"><path d="M3 4.5h10M6 4.5V3a1 1 0 011-1h2a1 1 0 011 1v1.5m1.5 0v8a1.5 1.5 0 01-1.5 1.5H6a1.5 1.5 0 01-1.5-1.5v-8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div></div>';
    });
    rows+='</div>';
  }
  app.innerHTML='<div class="page-header"><div class="page-header-left"><h1 class="page-title">\u{1F4CB} Задания</h1><div class="page-subtitle">Управление заданиями для участников исследования</div></div><div class="page-actions"><button class="btn btn-primary" onclick="openTaskModal(-1)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg> Создать</button></div></div><div class="stats-grid"><div class="stat-card"><div class="stat-label">Всего</div><div class="stat-value brand">'+tasks.length+'</div></div><div class="stat-card"><div class="stat-label">Активных</div><div class="stat-value green">'+ac+'</div></div><div class="stat-card"><div class="stat-label">Неактивных</div><div class="stat-value orange">'+(tasks.length-ac)+'</div></div><div class="stat-card"><div class="stat-label">Участников</div><div class="stat-value">'+participants.length+'</div></div></div><div class="card"><div class="card-title">Список заданий</div>'+rows+'</div>';
}
/* === TASK CRUD === */
function openTaskModal(idx){
  const isNew=idx===-1;
  const t=isNew?{title:'',description:'',active:true}:tasks[idx];
  const o=document.createElement('div');o.className='modal-overlay';
  o.onclick=e=>{if(e.target===o)o.remove()};
  const titleText=isNew?'Новое задание':'Редактировать';
  const btnText=isNew?'Создать':'Сохранить';
  o.innerHTML='<div class="modal"><div class="modal-header"><div class="modal-title">'+titleText+'</div><button class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">&#10005;</button></div><div class="form-group"><label class="form-label">Название *</label><input class="form-input" id="task-title" placeholder="Напр.: Заполнить описание таблицы" value="'+escA(t.title)+'"></div><div class="form-group"><label class="form-label">Описание</label><textarea class="form-textarea" id="task-desc" placeholder="Что должен сделать участник...">'+esc(t.description||'')+'</textarea></div><div class="form-group" style="margin-bottom:0"><div class="form-row-inline"><label class="toggle"><input type="checkbox" id="task-active"'+(t.active!==false?' checked':'')+'><span class="toggle-slider"></span></label><span class="form-label" style="margin:0">Активно</span></div></div><div class="form-actions"><button class="btn btn-secondary" onclick="this.closest(\'.modal-overlay\').remove()">Отмена</button><button class="btn btn-primary" id="task-save" onclick="saveTask('+idx+')">'+btnText+'</button></div></div>';
  document.body.appendChild(o);
  setTimeout(()=>document.getElementById('task-title')?.focus(),100);
}

async function saveTask(idx){
  const title=document.getElementById('task-title').value.trim();
  const desc=document.getElementById('task-desc').value.trim();
  const active=document.getElementById('task-active').checked;
  if(!title){document.getElementById('task-title').style.borderColor='#e74c3c';return}
  const btn=document.getElementById('task-save');btn.textContent='Сохранение\u2026';btn.disabled=true;
  const now=new Date().toISOString();
  if(idx===-1){
    const d={title,description:desc,active,order:tasks.length,createdAt:now,updatedAt:now};
    const k=await fbPush('onboarding_tasks',d);if(k)tasks.push({...d,_key:k});
  } else {
    const t=tasks[idx];const u={title,description:desc,active,updatedAt:now};
    await fbUpdate('onboarding_tasks/'+t._key,u);Object.assign(t,u);
  }
  document.querySelector('.modal-overlay')?.remove();render();
}

async function moveTask(i,dir){
  const ni=i+dir;if(ni<0||ni>=tasks.length)return;
  [tasks[i],tasks[ni]]=[tasks[ni],tasks[i]];
  await Promise.all(tasks.map((t,j)=>{t.order=j;return t._key?fbUpdate('onboarding_tasks/'+t._key,{order:j}):null}).filter(Boolean));
  render();
}

async function toggleActive(i,v){
  const t=tasks[i];if(!t?._key)return;t.active=v;
  await fbUpdate('onboarding_tasks/'+t._key,{active:v,updatedAt:new Date().toISOString()});
}

function confirmDeleteTask(i){
  const t=tasks[i];if(!t)return;
  showConfirm('задание \u00ab'+esc(t.title)+'\u00bb',async()=>{
    if(await fbDelete('onboarding_tasks/'+t._key)){
      tasks.splice(i,1);
      await Promise.all(tasks.map((t,j)=>{t.order=j;return t._key?fbUpdate('onboarding_tasks/'+t._key,{order:j}):null}).filter(Boolean));
      render();
    } else alert('Ошибка удаления');
  });
}
/* === PARTICIPANTS TAB === */
function renderParticipants(app){
  const n=participants.length;
  const avgC=n?Math.round(participants.reduce((s,p)=>s+(p.totalClicks||0),0)/n):0;
  const avgS=n?Math.round(participants.reduce((s,p)=>s+(p.sessionDuration||0),0)/n/1000):0;
  let rows='';
  if(n===0){
    rows='<div class="empty-state"><div class="empty-icon">\u{1F465}</div><div>Участников пока нет</div></div>';
  } else {
    rows='<div class="data-table"><div class="data-row header"><div class="data-cell" style="width:50px">&#8470;</div><div class="data-cell" style="width:100px">Грейд</div><div class="data-cell" style="flex:2">Должность</div><div class="data-cell" style="width:80px">Клики</div><div class="data-cell" style="width:100px">Сессия</div><div class="data-cell" style="width:130px">Дата</div><div class="data-cell" style="width:80px"></div></div>';
    participants.forEach((p,i)=>{
      const d=p.registeredAt?new Date(p.registeredAt).toLocaleDateString('ru-RU'):'\u2014';
      const dur=p.sessionDuration?Math.round(p.sessionDuration/1000)+'с':'\u2014';
      rows+='<div class="data-row" style="cursor:pointer" onclick="showDetail('+i+')"><div class="data-cell" style="width:50px">'+(i+1)+'</div><div class="data-cell" style="width:100px"><span class="badge grade">'+esc(p.grade||'\u2014')+'</span></div><div class="data-cell" style="flex:2">'+esc(p.position||'\u2014')+'</div><div class="data-cell" style="width:80px"><span class="click-count">'+(p.totalClicks||0)+'</span></div><div class="data-cell" style="width:100px">'+dur+'</div><div class="data-cell" style="width:130px">'+d+'</div><div class="data-cell" style="width:80px" onclick="event.stopPropagation()"><div class="actions-cell"><button class="btn-icon danger" onclick="deleteParticipant('+i+')" title="Удалить"><svg viewBox="0 0 16 16" fill="none"><path d="M3 4.5h10M6 4.5V3a1 1 0 011-1h2a1 1 0 011 1v1.5m1.5 0v8a1.5 1.5 0 01-1.5 1.5H6a1.5 1.5 0 01-1.5-1.5v-8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div></div>';
    });
    rows+='</div>';
  }
  app.innerHTML='<div class="page-header"><div class="page-header-left"><h1 class="page-title">\u{1F465} Участники</h1><div class="page-subtitle">'+n+' участников \u00b7 '+new Date().toLocaleString('ru-RU')+'</div></div><div class="page-actions"><button class="btn btn-secondary" onclick="exportCSV()">Экспорт CSV</button></div></div><div class="stats-grid"><div class="stat-card"><div class="stat-label">Участников</div><div class="stat-value brand">'+n+'</div></div><div class="stat-card"><div class="stat-label">Ср. кликов</div><div class="stat-value orange">'+avgC+'</div></div><div class="stat-card"><div class="stat-label">Ср. сессия</div><div class="stat-value">'+avgS+' сек</div></div><div class="stat-card"><div class="stat-label">Акт. заданий</div><div class="stat-value green">'+tasks.filter(t=>t.active!==false).length+'</div></div></div><div class="card"><div class="card-title">Список участников</div>'+rows+'</div>';
}
/* === DETAIL + DELETE + CSV + SHARED === */
function showDetail(i){
  const p=participants[i];if(!p)return;
  const dur=p.sessionDuration?Math.round(p.sessionDuration/1000):0;
  const date=p.registeredAt?new Date(p.registeredAt).toLocaleString('ru-RU'):'\u2014';
  const o=document.createElement('div');o.className='modal-overlay';
  o.onclick=e=>{if(e.target===o)o.remove()};
  o.innerHTML='<div class="modal" style="max-width:600px"><div class="modal-header"><div class="modal-title">Участник &#8470;'+(i+1)+'</div><button class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">&#10005;</button></div><div class="summary-grid"><div class="summary-item"><div class="summary-label">Грейд</div><div class="summary-value"><span class="badge grade">'+esc(p.grade||'\u2014')+'</span></div></div><div class="summary-item"><div class="summary-label">Должность</div><div class="summary-value">'+esc(p.position||'\u2014')+'</div></div><div class="summary-item"><div class="summary-label">Кликов</div><div class="summary-value">'+(p.totalClicks||0)+'</div></div><div class="summary-item"><div class="summary-label">Сессия</div><div class="summary-value">'+dur+' сек</div></div><div class="summary-item"><div class="summary-label">Дата</div><div class="summary-value">'+date+'</div></div></div></div>';
  document.body.appendChild(o);
}

function deleteParticipant(i){
  const p=participants[i];if(!p||!p._key)return;
  showConfirm('Участник &#8470;'+(i+1),async()=>{
    if(await fbDelete('onboarding_participants/'+p._key)){
      participants.splice(i,1);document.querySelectorAll('.modal-overlay').forEach(e=>e.remove());render();
    } else alert('Ошибка');
  });
}

function exportCSV(){
  if(!participants.length)return alert('Нет данных');
  const h=['№','Грейд','Должность','Дата','Кликов','Сессия (сек)'];
  const rows=participants.map((p,i)=>[i+1,'"'+(p.grade||'').replace(/"/g,'""')+'"','"'+(p.position||'').replace(/"/g,'""')+'"','"'+(p.registeredAt||'')+'"',p.totalClicks||0,p.sessionDuration?Math.round(p.sessionDuration/1000):0].join(','));
  const csv='\uFEFF'+h.join(',')+"\n"+rows.join("\n");
  const b=new Blob([csv],{type:'text/csv;charset=utf-8;'});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download='onboarding_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();URL.revokeObjectURL(u);
}

function showConfirm(name,onOk){
  const o=document.createElement('div');o.className='confirm-overlay';
  o.onclick=e=>{if(e.target===o)o.remove()};
  o.innerHTML='<div class="confirm-box"><div class="confirm-icon">&#9888;&#65039;</div><div class="confirm-title">Удалить?</div><div class="confirm-text">Вы собираетесь удалить <strong>'+name+'</strong>.<br>Это нельзя отменить.</div><div class="confirm-actions"><button class="btn btn-secondary" id="c-cancel">Отмена</button><button class="btn btn-danger" id="c-delete">Удалить</button></div></div>';
  document.body.appendChild(o);
  o.querySelector('#c-cancel').onclick=()=>o.remove();
  o.querySelector('#c-delete').onclick=async()=>{o.querySelector('#c-delete').textContent='Удаление\u2026';o.querySelector('#c-delete').disabled=true;await onOk();o.remove()};
}

async function refreshData(){
  document.getElementById('app').innerHTML='<div class="loading-state"><div class="loading-spinner"></div><div>Загрузка\u2026</div></div>';
  await fetchAll();render();
}

(async()=>{await fetchAll();render()})()

</script>
