<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Сброс</title>
<style>
body{font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f9f9f9}
.card{background:#fff;padding:40px;border-radius:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.card h1{font-size:20px;margin-bottom:8px}
.card p{color:#676767;font-size:14px;margin-bottom:24px}
.btn{display:inline-block;padding:12px 32px;background:#835de1;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.btn:hover{background:#6b48c9}
.done{color:#2e7d32;font-size:16px;font-weight:600;margin-top:16px;display:none}
</style>
</head>
<body>
<div class="card">
<h1>Сброс сессии</h1>
<p>Нажмите кнопку чтобы начать прохождение заново</p>
<button class="btn" onclick="doReset()">Сбросить и начать заново</button>
<div class="done" id="done">✅ Готово! Перенаправляю…</div>
</div>
<script>
function doReset(){
  // Полный сброс: удаляем пользователя и все данные сессии
  localStorage.removeItem('onboarding_current_user');
  localStorage.removeItem('research_current_user');
  localStorage.removeItem('research_participants');
  localStorage.removeItem('research_sessions');
  document.getElementById('done').style.display='block';
  // Редирект на главную — приложение откроется без регистрации (документация)
  setTimeout(function(){window.location.href='/onboarding-prototype/';},800);
}
</script>
</body>
</html>
